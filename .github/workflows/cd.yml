# Workflow de Entrega Contínua.
# Roda os testes unitários, builda e faz deploy de preview na Vercel,
# executa os testes E2E contra o preview e promove para produção se tudo passar.
name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      # 1. Faz o checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o Node.js na versão definida em NODE_VERSION
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para disponibilizar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto usando o yarn.lock
      - name: Install dependencies
        run: yarn install --immutable

      # 5. Executa os testes unitários com Vitest
      - name: Run unit tests
        run: yarn test

  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: unit-tests
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      # 1. Faz o checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o Node.js na versão definida em NODE_VERSION
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para disponibilizar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto usando o yarn.lock
      - name: Install dependencies
        run: yarn install --immutable

      # 5. Obtém as configurações do projeto na Vercel (usa a CLI já instalada
      #    como devDependency via `npx --no-install`, pra evitar divergência
      #    de versão/comportamento em relação a uma instalação global de
      #    "latest" — e evitar o banner que `yarn <bin>` mistura no stdout)
      - name: Pull Vercel config
        run: npx --no-install vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      # 6. Builda o projeto no formato esperado pela Vercel
      - name: Build project
        run: npx --no-install vercel build --token=$VERCEL_TOKEN

      # 7. Faz o deploy do build já pronto para o ambiente de preview
      #    (a CLI ignora --json quando roda sob CI=true e imprime texto para
      #    humanos mesmo assim, então extrai a URL por padrão em vez de
      #    depender do formato de saída. A URL contém o VERCEL_SCOPE como
      #    subdomínio, e como esse secret está cadastrado como Secret no
      #    GitHub, qualquer output contendo essa substring é descartado
      #    silenciosamente — por isso o valor vai em base64 pro job seguinte.)
      - name: Deploy to preview
        id: deploy
        run: |
          OUTPUT=$(npx --no-install vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --yes 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -1)
          echo "deployment-url=$(echo -n "$URL" | base64 -w0)" >> "$GITHUB_OUTPUT"

  e2e-tests:
    name: E2E Tests (Preview)
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      # 1. Faz o checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o Node.js na versão definida em NODE_VERSION
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para disponibilizar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto usando o yarn.lock
      - name: Install dependencies
        run: yarn install --immutable

      # 5. Instala os browsers do Playwright
      - name: Install Playwright Browsers
        run: yarn playwright install --with-deps chromium

      # 6. Executa os testes E2E contra o deploy de preview
      - name: Run E2E tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 7. Publica o relatório do Playwright como artefato
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # 8. Publica o relatório no Test Dino (dashboard executivo)
      - name: Upload report to Test Dino
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npx tdpw upload playwright-report
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}

  promote:
    name: Promote to Production
    needs: [build-and-deploy, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      # 1. Promove o deploy de preview já validado para produção
      #    (pinada na mesma versão da CLI usada no build/deploy, ver package.json.
      #    A URL chega em base64, ver comentário no step "Deploy to preview".)
      - name: Promote deployment
        env:
          DEPLOYMENT_URL_B64: ${{ needs.build-and-deploy.outputs.deployment-url }}
        run: |
          DEPLOYMENT_URL=$(echo "$DEPLOYMENT_URL_B64" | base64 -d)
          npx vercel@58.9.0 promote "$DEPLOYMENT_URL" \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE \
          --yes
